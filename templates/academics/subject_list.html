
{% extends "base.html" %}

{% block title %}Subjects | Student Analytics{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Subjects</h1>
    <a href="{% url 'academics:subject_create' %}" class="btn btn-primary">
        + Add Subject
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr><th>Code</th><th>Subject</th></tr>
            </thead>
            <tbody>
                {% for subject in subjects %}
                <tr><td>{{ subject.code }}</td><td>{{ subject.name }}</td></tr>
                {% empty %}
                <tr><td colspan="2" class="text-center py-4">No subjects yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
