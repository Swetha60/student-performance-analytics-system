
{% extends "base.html" %}

{% block title %}Delete Marks | Student Analytics{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-body p-4">
        <h1 class="h3">Delete Marks</h1>
        <p>
            Delete the marks recorded for <strong>{{ mark.student }}</strong>
            in {{ mark.assessment.subject }} for {{ mark.assessment.exam }}?
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a href="{% url 'academics:mark_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
