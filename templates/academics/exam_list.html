
{% extends "base.html" %}

{% block title %}Exams | Student Analytics{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Exams</h1>
    <a href="{% url 'academics:exam_create' %}" class="btn btn-primary">
        + Create Exam
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr><th>Name</th><th>Date</th><th>Description</th></tr>
            </thead>
            <tbody>
                {% for exam in exams %}
                <tr>
                    <td>{{ exam.name }}</td>
                    <td>{{ exam.date }}</td>
                    <td>{{ exam.description|default:"—" }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center py-4">No exams yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
